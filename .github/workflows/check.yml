name: R checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::terra
            any::readr
            any::testthat
          cache-version: 1
      - name: Test geometry, raster aggregation, and coordinate handling
        run: Rscript -e 'testthat::test_file("tests/test-analysis.R", stop_on_failure = TRUE)'
